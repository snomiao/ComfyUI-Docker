# persistant volumes
volumes:
  python-packages:
  ComfyUI:
  
services:
  comfyui:
    restart: always
    image: snomiao/comfyui:cpu
    build: .
    volumes:
      - ComfyUI:/ComfyUI
      - python-packages:/opt/conda/lib/python3.10/site-packages
    develop:
      watch:
        - action: rebuild
          path: ./entry.sh
    ports:
      - 8188:8188
